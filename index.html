    // Parser to execute inline HTML strings inside #appContent
    function executeJSContent(htmlDocString) {
      const container = document.getElementById("appContent");
      const parser = new DOMParser();
      const parsedDoc = parser.parseFromString(htmlDocString, "text/html");
      
      container.innerHTML = parsedDoc.body.innerHTML;

      // Re-trigger script elements inside the payload string
      const scripts = parsedDoc.querySelectorAll("script");
      scripts.forEach(s => {
        const newScript = document.createElement("script");
        newScript.textContent = s.textContent;
        document.body.appendChild(newScript);
      });
    }

    // --- JavaScript HTML String Modules ---

			<div class="rack-tiles" id="rack-tiles"></div>
		</div>

		<div class="solutions-tracker">
			<div class="tracker-status" id="tracker-status">Found 0 of 0 Bingos</div>
			<div class="solution-slots" id="solution-slots"></div>
		</div>

		<div class="input-section">
			<input type="text" id="guess-input" class="guess-input" placeholder="ENTER BINGO GUESS" autocomplete="off" spellcheck="false" maxlength="7">
			<div class="btn-group">
				<button class="submit-btn" onclick="submitGuess()">SUBMIT BINGO</button>
				<button class="reveal-btn" onclick="revealAnswers()">REVEAL</button>
				<button class="skip-btn" onclick="skipBingo()">SKIP</button>
			</div>
		</div>

		<label class="upload-container" for="csv-file-input">
				UPLOAD?
				<input type="file" id="csv-file-input" accept=".csv" onchange="handleCSVUpload(event)">
			</label>
	</div>

	<div class="sidebar">
		<div class="sidebar-title">Bingo History</div>
		<div class="history-list" id="history-list"></div>
		<button class="save-btn" onclick="exportCSVProgress()">SAVE.</button>
	</div>
</div>

<!-- Modal -->
<div id="bingo-modal-overlay" class="modal-overlay">
	<div class="modal-box">
		<div class="modal-header">
			<div class="modal-header-top">
				<span class="modal-title" id="modal-title">Lookup Tool</span>
				<div class="modal-search-bar">
					<input type="text" id="modal-search-input" placeholder="Enter word...">
					<button onclick="triggerModalSearch()">Search</button>
				</div>
				<div class="modal-actions">
					<a id="modal-external-link" href="#" target="_blank" class="external-link-btn">↗ Open M-W</a>
					<button class="modal-close-btn" onclick="closeModal()">&times;</button>
				</div>
			</div>
			<div class="modal-anagram-pills" id="modal-anagram-pills">
				<span class="modal-pill-label">Rack Anagrams:</span>
			</div>
		</div>
		<div class="modal-body">
			<iframe id="modal-iframe" src=""></iframe>
		</div>
	</div>
</div>

<script>
	const letterValues = {
			A:1, B:3, C:3, D:2, E:1, F:4, G:2, H:4, I:1, J:8, K:5, L:1, M:3, N:1, O:1, P:3, Q:10, R:1, S:1, T:1, U:1, V:4, W:4, X:8, Y:4, Z:10
		};

		const defaultBingoWords = [
			"NOTAIRE", "OTARINE", "ETAERIO", "ANEROID", "AILERON", "ALERION", "ALIENOR", "ELATION", "TOENAIL", "ERASION", "ATONIES", "OARIEST", "OTARIES", "ROASTIE", "ARENITE", "RETINAE", "TRAINEE", "ORIGANE", "GOATIER", "ANTIRED", "DETRAIN", "TRAINED", "ENTRAIL", "LATRINE", "RATLINE", "RELIANT", "RETINAL", "TRENAIL", "ANESTRI", "ANTSIER", "NASTIER", "RATINES", "RESIANT", "RETAINS", "RETINAS", "RETSINA", "STAINER", "STARNIE", "STEARIN", "RUINATE", "TAURINE", "URANITE", "URINATE", "DARIOLE", "ADONISE", "ANODISE", "SODAINE", "RADIOES", "ROADIES", "SOREDIA", "IODATES", "TOADIES", "ANISOLE", "SEALION", "ISOLATE", "INERTIA", "TORNADE", "ATONERS", "SANTERO", "SENATOR", "TREASON", "OUTEARN", "RETINOL", "NORITES", "OESTRIN", "ORIENTS", "STONIER", "TERSION", "TRIONES", "ROUTINE", "ALIENER", "LINEATE", "ATELIER", "REALTIE", "ETESIAN", "AERIEST", "SERIATE", "AERADIO", "AEOLIAN", "OLEARIA", "ENATION", "GRANITE", "GRATINE", "INGRATE", "TANGIER", "TEARING", "TAENIAE", "ARENOSE", "ROSEATE", "ORDINEE", "ELOINER", "TROELIE", "EROTISE", "NIOBATE", "ACONITE", "ANOETIC", "EROTICA", "MORAINE", "ROMAINE", "AMNIOTE", "GODETIA", "AGONIES", "AGONISE", "GOATIES", "NEGATOR", "GENITOR", "DILATER", "REDTAIL", "TRAILED", "TRIALED", "RANDIES", "SANDIER", "SARDINE", "UNAIRED", "URANIDE", "DESTAIN", "DETAINS", "INSTEAD", "NIDATES", "SAINTED", "SATINED", "STAINED", "AUDIENT", "ARIDEST", "ASTERID", "ASTRIDE", "DIASTER", "DISRATE", "STAIDER", "STAIRED", "TARDIES", "TIRADES", "TRADIES", "ALINERS", "NAILERS", "RENAILS", "EASTLIN", "ELASTIN", "ENTAILS", "NAILSET", "SALIENT", "SALTINE", "SLAINTE", "STANIEL", "TENAILS", "ALUNITE", "REALIST", "RETAILS", "SALTIER", "SALTIRE", "SLATIER", "TAILERS", "URALITE", "AUNTIES", "SINUATE", "REGINAE", "DIATRON", "AROINTS", "RATIONS", "RAINOUT", "ARANEID", "AIRDATE", "RADIATE", "TIARAED", "ANTLIAE", "ENTASIA", "TAENIAS", "ARISTAE", "ASTERIA", "ATRESIA", "DENARII", "INEDITA", "AIRLINE", "SENARII", "ISATINE", "AIRIEST", "IRISATE", "DEASOIL", "ISOLEAD", "DOULEIA", "EATERIE", "LADRONE", "TALONED", "DELATOR", "LEOTARD", "RONDEAU", "ASTONED", "DONATES", "ONSTEAD", "DOATERS", "ROASTED", "TORSADE", "TROADES", "OUTDARE", "OUTREAD", "READOUT", "LOANERS", "ORLEANS", "RELOANS", "ALEURON", "ETALONS", "TOLANES", "OESTRAL", "OLESTRA", "ROTULAE", "TORULAE", "ARENOUS", "SOUTANE", "LENTOID", "DOILTER", "DINEROS", "DONSIER", "INDORSE", "ORDINES", "ROSINED", "SORDINE", "DOURINE", "NEUROID", "OUNDIER", "DITONES", "STONIED", "EDITORS", "ROISTED", "ROSITED", "SORTIED", "STEROID", "STORIED", "TRIODES", "ETOURDI", "IODURET", "OUTRIDE", "LIENORS", "NEROLIS", "SONLIER", "ENTOILS", "LIONETS", "ONLIEST", "ELUTION", "OUTLINE", "ESTRIOL", "LOITERS", "TOILERS", "OUTLIER", "URINOSE", "OURIEST", "STOURIE", "TOURIES", "TOUSIER", "ENTRAIN", "TRANNIE"
		];

		let bingoData = [];
		let currentItem = null;
		let currentShuffledRack = [];
		let foundWordsCurrentRack = [];
		let revealedWordsCurrentRack = [];
		let isAssistedTurn = false;
		let draggedIndex = null;
		let activeModalType = 'dict';

		function startGame() {
			document.getElementById('start-screen-overlay').style.display = 'none';
			document.getElementById('guess-input').focus();
		}

		function initLearner(wordArray) {
			const groups = {};
			wordArray.forEach(rawWord => {
				const word = rawWord.trim().toUpperCase();
				if (word.length === 7) {
					const alpha = word.split('').sort().join('');
					if (!groups[alpha]) groups[alpha] = [];
					if (!groups[alpha].includes(word)) groups[alpha].push(word);
				}
			});

			bingoData = Object.keys(groups).map(alpha => ({
				alphagram: alpha,
				validWords: groups[alpha],
				weight: 10,
				attempts: 0,
				correct: 0,
				streak: 0
			}));

			nextTurn();
		}

		function getWeightedRandomItem() {
			const totalWeight = bingoData.reduce((sum, item) => sum + item.weight, 0);
			let randomNum = Math.random() * totalWeight;

			for (let item of bingoData) {
				if (randomNum < item.weight) return item;
				randomNum -= item.weight;
			}
			return bingoData[0];
		}

		function nextTurn() {
			if (bingoData.length === 0) return;

			currentItem = getWeightedRandomItem();
			currentShuffledRack = currentItem.alphagram.split('');
			foundWordsCurrentRack = [];
			revealedWordsCurrentRack = [];
			isAssistedTurn = false;

			for (let i = currentShuffledRack.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[currentShuffledRack[i], currentShuffledRack[j]] = [currentShuffledRack[j], currentShuffledRack[i]];
			}

			renderRack();
			renderSolutionTracker();
			document.getElementById('guess-input').value = '';
			if (document.getElementById('start-screen-overlay').style.display === 'none') {
				document.getElementById('guess-input').focus();
			}
		}

		function renderRack() {
			const container = document.getElementById('rack-tiles');
			container.innerHTML = '';

			currentShuffledRack.forEach((letter, index) => {
				const tile = document.createElement('div');
				tile.className = 'tile';
				tile.setAttribute('draggable', 'true');
				tile.dataset.index = index;
				tile.innerText = letter;

				const pt = document.createElement('span');
				pt.className = 'points';
				pt.innerText = letterValues[letter] || 0;
				tile.appendChild(pt);

				tile.addEventListener('dragstart', (e) => {
					draggedIndex = index;
					tile.classList.add('dragging');
					e.dataTransfer.effectAllowed = 'move';
					e.dataTransfer.setData('text/plain', index);
				});

				tile.addEventListener('dragover', (e) => {
					e.preventDefault();
					e.dataTransfer.dropEffect = 'move';
					tile.classList.add('drag-over');
				});

				tile.addEventListener('dragleave', () => {
					tile.classList.remove('drag-over');
				});

				tile.addEventListener('drop', (e) => {
					e.preventDefault();
					tile.classList.remove('drag-over');
					const targetIndex = parseInt(tile.dataset.index, 10);

					if (draggedIndex !== null && draggedIndex !== targetIndex) {
						const movedLetter = currentShuffledRack.splice(draggedIndex, 1)[0];
						currentShuffledRack.splice(targetIndex, 0, movedLetter);
						renderRack();
					}
				});

				tile.addEventListener('dragend', () => {
					tile.classList.remove('dragging');
					document.querySelectorAll('.tile').forEach(t => t.classList.remove('drag-over'));
					draggedIndex = null;
				});

				container.appendChild(tile);
			});
		}

		function renderSolutionTracker() {
			const statusEl = document.getElementById('tracker-status');
			const slotsEl = document.getElementById('solution-slots');
			slotsEl.innerHTML = '';

			const total = currentItem.validWords.length;
			const foundCount = foundWordsCurrentRack.length;

			statusEl.innerText = \`Found \${foundCount} of \${total} Bingo\${total > 1 ? 's' : ''}\`;

			currentItem.validWords.forEach(word => {
				const pill = document.createElement('div');
				if (foundWordsCurrentRack.includes(word)) {
					pill.className = 'slot-pill found';
					pill.innerText = word;
				} else if (revealedWordsCurrentRack.includes(word)) {
					pill.className = 'slot-pill revealed-pending';
					pill.innerText = word;
				} else {
					pill.className = 'slot-pill';
					pill.innerText = '•••••••';
				}
				slotsEl.appendChild(pill);
			});
		}

		function submitGuess() {
			const inputEl = document.getElementById('guess-input');
			const guess = inputEl.value.trim().toUpperCase();
			if (!guess) return;

			if (currentItem.validWords.includes(guess)) {
				if (foundWordsCurrentRack.includes(guess)) {
					triggerInputError(inputEl);
				} else {
					foundWordsCurrentRack.push(guess);
					
					const revIndex = revealedWordsCurrentRack.indexOf(guess);
					if (revIndex > -1) revealedWordsCurrentRack.splice(revIndex, 1);

					inputEl.value = '';
					renderSolutionTracker();

					if (foundWordsCurrentRack.length === currentItem.validWords.length) {
						currentItem.attempts++;
						if (!isAssistedTurn) {
							currentItem.correct++;
							currentItem.streak++;
							currentItem.weight = Math.max(1, currentItem.weight - 4);
							addHistoryEntry('correct', \`\${foundWordsCurrentRack.join(', ')}\`, currentItem.validWords);
						} else {
							currentItem.streak = 0;
							currentItem.weight += 6;
							addHistoryEntry('assisted', \`\${foundWordsCurrentRack.join(', ')} (Revealed)\`, currentItem.validWords);
						}

						setTimeout(nextTurn, 300);
					}
				}
			} else {
				triggerInputError(inputEl);
			}
		}

		function revealAnswers() {
			isAssistedTurn = true;
			currentItem.validWords.forEach(word => {
				if (!foundWordsCurrentRack.includes(word) && !revealedWordsCurrentRack.includes(word)) {
					revealedWordsCurrentRack.push(word);
				}
			});

			renderSolutionTracker();
			document.getElementById('guess-input').focus();
		}

		function skipBingo() {
			currentItem.attempts++;
			currentItem.streak = 0;
			currentItem.weight += 12;

			const slotsEl = document.getElementById('solution-slots');
			slotsEl.innerHTML = '';
			currentItem.validWords.forEach(word => {
				const pill = document.createElement('div');
				if (foundWordsCurrentRack.includes(word)) {
					pill.className = 'slot-pill found';
					pill.innerText = word;
				} else {
					pill.className = 'slot-pill skipped';
					pill.innerText = word;
				}
				slotsEl.appendChild(pill);
			});

			addHistoryEntry('incorrect', \`SKIPPED (\${foundWordsCurrentRack.length}/\${currentItem.validWords.length})\`, currentItem.validWords);

			setTimeout(nextTurn, 1400);
		}

		function triggerInputError(inputEl) {
			inputEl.classList.add('error-shake');
			setTimeout(() => inputEl.classList.remove('error-shake'), 350);
		}

		function addHistoryEntry(type, userText, validSolutions) {
			const historyList = document.getElementById('history-list');
			const card = document.createElement('div');
			card.className = \`history-card \${type}\`;

			const wordText = document.createElement('div');
			wordText.className = 'history-word';
			
			let symbol = '✓';
			if (type === 'assisted') symbol = '👁';
			if (type === 'incorrect') symbol = '✗';

			wordText.innerText = \`\${symbol} \${userText}\`;

			const solText = document.createElement('div');
			solText.className = 'history-solutions';
			solText.innerText = \`Valid: \${validSolutions.join(', ')}\`;

			card.appendChild(wordText);
			card.appendChild(solText);
			historyList.prepend(card);
		}

		document.getElementById('guess-input').addEventListener('keydown', function (e) {
			if (e.key === 'Enter') {
				e.preventDefault();
				submitGuess();
			}
		});

		function renderModalPills(activeWord) {
			const container = document.getElementById('modal-anagram-pills');
			container.innerHTML = '<span class="modal-pill-label">Rack Anagrams:</span>';

			if (!currentItem || !currentItem.validWords) return;

			currentItem.validWords.forEach(word => {
				const pill = document.createElement('button');
				pill.className = \`modal-word-pill \${word === activeWord ? 'active' : ''}\`;
				pill.innerText = word;
				pill.onclick = () => {
					document.getElementById('modal-search-input').value = word;
					loadModalIframe(word);
					renderModalPills(word);
				};
				container.appendChild(pill);
			});
		}

		function getCurrentSearchWord() {
			const inputVal = document.getElementById('guess-input').value.trim();
			if (inputVal) return inputVal;
			if (foundWordsCurrentRack.length > 0) return foundWordsCurrentRack[foundWordsCurrentRack.length - 1];
			if (currentItem && currentItem.validWords.length > 0) return currentItem.validWords[0];
			return "";
		}

		function openDictionary() {
			activeModalType = 'dict';
			const word = getCurrentSearchWord();
			document.getElementById('modal-title').innerText = "Wiktionary (Iframe Friendly)";
			document.getElementById('modal-search-input').value = word;
			renderModalPills(word);
			loadModalIframe(word);
			document.getElementById('bingo-modal-overlay').style.display = 'flex';
		}

		function openImageSearch() {
			activeModalType = 'img';
			const word = getCurrentSearchWord();
			document.getElementById('modal-title').innerText = "Google Image Search";
			document.getElementById('modal-search-input').value = word;
			renderModalPills(word);
			loadModalIframe(word);
			document.getElementById('bingo-modal-overlay').style.display = 'flex';
		}

		function loadModalIframe(word) {
			const iframe = document.getElementById('modal-iframe');
			const extLink = document.getElementById('modal-external-link');

			let iframeUrl = "";
			let fallbackUrl = "";

			const lowerWord = word ? word.toLowerCase() : "";

			if (activeModalType === 'dict') {
				iframeUrl = lowerWord ? \`https://en.m.wiktionary.org/wiki/\${encodeURIComponent(lowerWord)}\` : \`https://en.m.wiktionary.org/\`;
				fallbackUrl = lowerWord ? \`https://www.merriam-webster.com/dictionary/\${encodeURIComponent(lowerWord)}\` : \`https://www.merriam-webster.com/\`;
				extLink.innerText = "↗ Open Merriam-Webster";
			} else {
				iframeUrl = lowerWord ? \`https://www.google.com/search?tbm=isch&q=\${encodeURIComponent(lowerWord)}&igu=1\` : \`https://images.google.com\`;
				fallbackUrl = lowerWord ? \`https://www.google.com/search?tbm=isch&q=\${encodeURIComponent(lowerWord)}\` : \`https://images.google.com\`;
				extLink.innerText = "↗ Open Google Images";
			}

			iframe.src = iframeUrl;
			extLink.href = fallbackUrl;
		}

		function triggerModalSearch() {
			const word = document.getElementById('modal-search-input').value.trim();
			loadModalIframe(word);
			renderModalPills(word.toUpperCase());
		}

		function closeModal() {
			document.getElementById('bingo-modal-overlay').style.display = 'none';
			document.getElementById('modal-iframe').src = '';
		}

		function exportCSVProgress() {
			let csvContent = "data:text/csv;charset=utf-8,Alphagram,ValidWords,Weight,Attempts,Correct,Streak\\n";
			bingoData.forEach(item => {
				const validStr = \`"\${item.validWords.join(';')}"\`;
				csvContent += \`\${item.alphagram},\${validStr},\${item.weight},\${item.attempts},\${item.correct},\${item.streak}\\n\`;
			});

			const encodedUri = encodeURI(csvContent);
			const link = document.createElement("a");
			link.setAttribute("href", encodedUri);
			link.setAttribute("download", "scrabble_bingo_progress.csv");
			document.body.appendChild(link);
			link.click();
			document.body.removeChild(link);
		}

		function handleCSVUpload(event) {
			const file = event.target.files[0];
			if (!file) return;

			const reader = new FileReader();
			reader.onload = function (e) {
				const content = e.target.result;
				const lines = content.split(/\\r\\n|\\n/);

				if (lines[0].includes('Alphagram') && lines[0].includes('ValidWords')) {
					bingoData = [];
					for (let i = 1; i < lines.length; i++) {
						if (!lines[i].trim()) continue;
						const parts = lines[i].split(',');
						if (parts.length >= 6) {
							const alpha = parts[0].trim();
							const words = parts[1].replace(/"/g, '').split(';');
							const weight = parseInt(parts[2]);
							const attempts = parseInt(parts[3]);
							const correct = parseInt(parts[4]);
							const streak = parseInt(parts[5]);

							bingoData.push({
								alphagram: alpha,
								validWords: words,
								weight: isNaN(weight) ? 10 : weight,
								attempts: isNaN(attempts) ? 0 : attempts,
								correct: isNaN(correct) ? 0 : correct,
								streak: isNaN(streak) ? 0 : streak
							});
						}
					}
					nextTurn();
				} else {
					const rawWords = content.split(/[\\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
					initLearner(rawWords);
				}
			};
			reader.readAsText(file);
		}

		initLearner(defaultBingoWords);
	<\/script>
      `;
      executeJSContent(bingoHTML);
    }

    // --- Key Trackers & Helpers ---

    window.addEventListener("keydown", (e) => {
      if (e.key.length === 1) {
        typedBuffer += e.key.toLowerCase();
        
        if (typedBuffer.length > 10) {
          typedBuffer = typedBuffer.slice(-10);
        }

        if (typedBuffer.endsWith("back")) {
          openHomeModal();
          typedBuffer = "";
        }

        if (currentPhase === "game" && !isWordsModalOpen && typedBuffer.endsWith("words")) {
          openWordsModal();
          typedBuffer = "";
        }

        if (isWordsModalOpen && typedBuffer.endsWith("esc")) {
          closeWordsModal();
          typedBuffer = "";
        }
      }
    });

    function openHomeModal() {
      currentPhase = "home";
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeHomeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    function openWordsModal() {
      isWordsModalOpen = true;
      document.getElementById("wordsModal").style.display = "flex";
    }

    function closeWordsModal() {
      isWordsModalOpen = false;
      document.getElementById("wordsModal").style.display = "none";
    }

    function openRules() {
      document.getElementById("rulesModal").style.display = "flex";
    }

    function closeRules() {
      document.getElementById("rulesModal").style.display = "none";
    }
	</script>

</body>
