	<script>
    
    
    function openRules() {
    const rulesModal = document.getElementById('rulesModal');
    if (rulesModal) rulesModal.style.display = 'flex';
}

function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) modal.style.display = 'none';
}

function closeRules() {
    closeModal('rulesModal');
}
    
    
		let typedBuffer = "";
    let currentPhase = "home";
    let isWordsModalOpen = false;

    // Parser to execute inline HTML strings inside #appContent
    function executeJSContent(htmlDocString) {
      const container = document.getElementById("appContent");
      
      // Clear viewport and remove styles dynamically injected by previous views
      container.innerHTML = "";
      document.querySelectorAll('style[data-injected-style="true"]').forEach(el => el.remove());

      const parser = new DOMParser();
      const parsedDoc = parser.parseFromString(htmlDocString, "text/html");

      // Extract and inject <style> tags into active document head
      const styles = parsedDoc.querySelectorAll("style");
      styles.forEach(style => {
        const dynamicStyle = document.createElement("style");
        dynamicStyle.setAttribute("data-injected-style", "true");
        dynamicStyle.textContent = style.textContent;
        document.head.appendChild(dynamicStyle);
      });

      // Inject body markup into viewport
      container.innerHTML = parsedDoc.body.innerHTML;

      // Re-trigger and execute scripts
      const scripts = parsedDoc.querySelectorAll("script");
      scripts.forEach(s => {
        const newScript = document.createElement("script");
        Array.from(s.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.textContent = s.textContent;
        document.body.appendChild(newScript);
      });
    }

    // --- JavaScript Module Loaders ---

    function runWordsJS() {
      currentPhase = "words";
      closeHomeModal();
      const wordsHTML = document.getElementById("wordsTemplate").innerHTML;
      executeJSContent(wordsHTML);
    }

    function runGameJS() {
      currentPhase = "game";
      closeHomeModal();
      const gameHTML = document.getElementById("gameTemplate").innerHTML;
      executeJSContent(gameHTML);
    }

    function runBingoJS() {
      currentPhase = "bingo";
      closeHomeModal();
      const bingoHTML = document.getElementById("bingoTemplate").innerHTML;
      executeJSContent(bingoHTML);
    }

    // --- Key Trackers & Helpers ---

    window.addEventListener("keydown", (e) => {
      if (e.key.length === 1) {
        typedBuffer += e.key.toLowerCase();
        
        if (typedBuffer.length > 10) {
          typedBuffer = typedBuffer.slice(-10);
        }

        if (typedBuffer.endsWith("bac")) {
          openHomeModal();
          typedBuffer = "";
        }

        if (currentPhase === "game" && !isWordsModalOpen && typedBuffer.endsWith("wordsy")) {
          openWordsModal();
          typedBuffer = "";
        }

        if (isWordsModalOpen && typedBuffer.endsWith("esc")) {
          closeWordsModal();
          typedBuffer = "";
        }
      }
    });

    function openHomeModal() {
      currentPhase = "home";
      document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeHomeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    function openWordsModal() {
      isWordsModalOpen = true;
      document.getElementById("wordsModal").style.display = "flex";
    }

    function closeWordsModal() {
      isWordsModalOpen = false;
      document.getElementById("wordsModal").style.display = "none";
    }

    function openRules() {
      document.getElementById("rulesModal").style.display = "flex";
    }

    function closeRules() {
      document.getElementById("rulesModal").style.display = "none";
    }
	</script>
    <script>
    let currentView = 'home';
    let keyBuffer = '';

    // Block browser back button in File 2 (Game) & File 3 (Bingo)
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function () {
        if (currentView === 'game' || currentView === 'bingo') {
            history.pushState(null, null, location.href);
        }
    });

    // Keydown Listener: Detect "words" sequence and disable ESC in File 2 & 3
    document.addEventListener('keydown', function(e) {
        // Disable ESC in File 2 and File 3
        if (e.key === 'Escape') {
            if (currentView === 'game' || currentView === 'bingo') {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            closeWordsModal();
            closeRules();
            return;
        }

        // Typing buffer for "words" modal trigger
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
            keyBuffer += e.key.toLowerCase();
            if (keyBuffer.length > 10) {
                keyBuffer = keyBuffer.slice(-10);
            }
            if (keyBuffer.endsWith('words')) {
                openWordsModal();
                keyBuffer = '';
            }
        }
    });

    function openWordsModal() {
        const modal = document.getElementById('wordsModal');
        const content = modal.querySelector('.popup-content');
        const template = document.getElementById('wordsTemplate');
        if (template && content) {
            content.innerHTML = template.innerHTML;
        }
        modal.style.display = 'flex';
    }

    function closeWordsModal() {
        document.getElementById('wordsModal').style.display = 'none';
    }

    function openRules() {
        // Disable 'i' button function in File 2 & 3
        if (currentView === 'game' || currentView === 'bingo') return;
        document.getElementById('rulesModal').style.display = 'flex';
    }

    function closeRules() {
        document.getElementById('rulesModal').style.display = 'none';
    }

    function updateInfoButtonVisibility() {
        const infoBtn = document.querySelector('.info-btn');
        if (infoBtn) {
            infoBtn.style.display = (currentView === 'game' || currentView === 'bingo') ? 'none' : 'flex';
        }
    }

    function loadTemplateToApp(templateId) {
        const app = document.getElementById('appContent');
        const template = document.getElementById(templateId);
        if (template && app) {
            app.innerHTML = template.innerHTML;
            
            // Re-evaluate script tags injected from templates
            const scripts = app.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }
        document.getElementById('modalOverlay').style.display = 'none';
    }

    function runWordsJS() {
        currentView = 'word';
        updateInfoButtonVisibility();
        loadTemplateToApp('wordsTemplate');
    }

    function runGameJS() {
        currentView = 'game';
        updateInfoButtonVisibility();
        loadTemplateToApp('gameTemplate');
    }

    function runBingoJS() {
        currentView = 'bingo';
        updateInfoButtonVisibility();
        loadTemplateToApp('wordsTemplate');
    }
</script>
